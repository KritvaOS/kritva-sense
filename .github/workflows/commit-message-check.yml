# commit-message-check.yml: GitHub Actions check that new commits carry no AI session trailers
# Security control from kritva-program decision D-032 (follow-up).

name: commit-message-check

on:
  pull_request:

permissions:
  contents: read

jobs:
  commit-message-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Test the commit message checker
        run: python3 -m unittest discover -s tests/commit_message_check -v
      - name: Check commits in this pull request
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/security/check_commit_messages.py --range "origin/${BASE_REF}..HEAD"
