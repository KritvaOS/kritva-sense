# unit-tests.yml: runs the Sense contract unit gate (make test-unit), the structure checks (KOS-SENSE-002, AC-205) and the
# integration gate (make test-integration, KOS-SENSE-009 AC-907) as separate, visible steps of the one required check.
name: unit-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Structure checks
        run: make check docs-check
      - name: Unit gate
        run: make test-unit
      - name: Integration gate
        run: make test-integration
