# Package metadata for kritva-sense (KOS-SENSE-007). The runtime has no dependency outside the Python
# standard library. Build tools are pinned here and in release/build-requirements.txt, never as runtime
# dependencies. The package version is not a contract version: see RELEASE.md.
[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kritva-sense"
version = "0.2.0"
description = "Reference validation, frame graph, synthetic data generator, stream checker and consumer conformance harness for the Kritva Sense data contracts (software only, synthetic data)"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 3 - Alpha",
]

[project.scripts]
kritva-sense-validate = "kritva_sense._entry:validate"
kritva-sense-frame-graph = "kritva_sense._entry:frame_graph"
kritva-sense-generator = "kritva_sense._entry:generator"
kritva-sense-stream = "kritva_sense._entry:stream"
kritva-sense-conformance = "kritva_sense._entry:conformance"
kritva-sense-version = "kritva_sense.version:main"

[tool.setuptools]
include-package-data = false
packages = ["kritva_sense", "kritva_sense.contract"]

[tool.setuptools.package-dir]
"" = "src"
"kritva_sense.contract" = "contract"

[tool.setuptools.package-data]
"kritva_sense.contract" = ["*.md", "*.json"]
